<!DOCTYPE html>
<html>
<head>
    <title>Penghitung Nilai Akhir</title>
</head>
<body>

    <h2>menghitung nilai USA UST & TUGAS</h2>

    <label>Nilai Tugas:</label>
    <input type="number" id="tugas" placeholder="contoh:85"><br><br>

    <label>Nilai UTS:</label>
    <input type="number" id="uts" placeholder="contoh:85"><br><br>

    <label>Nilai UAS:</label>
    <input type="number" id="uas" placeholder="contoh:85"><br><br>

    <button onclick="hitungNilai()">Hitung Nilai</button>

    <p id="hasil"></p>

    <script>
        function hitungNilai() {

            let tugas = Number(document.getElementById("tugas").value);
            let uts = Number(document.getElementById("uts").value);
            let uas = Number(document.getElementById("uas").value);

            let nilaiAkhir = (tugas * 30 + uts * 30 + uas * 40) / 100;

            let grade;

            if (nilaiAkhir >= 90) {
                grade = "A";
            } else if (nilaiAkhir >= 80) {
                grade = "B";
            } else if (nilaiAkhir >= 70) {
                grade = "C";
            } else {
                grade = "D";
            }

            let status;

            if (nilaiAkhir >= 75 && uas >= 60) {
                status = "Lulus CEUNAH";
            } else {
                status = "WKWKWK REMED";
            }

            document.getElementById("hasil").innerHTML =
                "<br> " + nilaiAkhir.toFixed(2) + "<br>" + grade + "<br>" + status;
                
        }
    </script>

</body>
</html>
